<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La règle face à la complexité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
/* VOICE a short management game for a class: one office, one lever, a result every quarter, a target to beat
   IDEA the internship office's quarterly P&L: each quarter a bar above or below zero, the season's target on top
   PICTURE the P&L chart: quarterly result as bars above/below zero, surprises flagged, the coming quarter drawn live as the slider moves
   COLOUR white ground; blue for rigid modelling (attenuation) and its shocks, violet for the AI system (amplification) and its shocks, amber for rare events; red only for alerts and losses, green for gains
   TYPE Archivo wide 800 for figures, Archivo for text
   LAYOUT one screen: slim header with target and replay; left the decision and what it means now; right the P&L chart and the attempts */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e0e0e);--ink:light-dark(#111111,#f2f2f2);--mut:light-dark(#5c5c5c,#a8a8a8);--line:light-dark(#dcdcdc,#2e2e2e);--red:light-dark(#e4002b,#ff4d6a);--grn:light-dark(#0a7a3d,#4cc985);--pane:light-dark(#f4f4f4,#171717);--amb:light-dark(#b85c00,#ffa24d);--deep:light-dark(#7d0a1c,#ff8a9a);--blu:light-dark(#1d5fb4,#7fb0ff);--ai:light-dark(#6b3fa0,#c29bff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16.5px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip;display:flex;flex-direction:column}
header{border-top:6px solid var(--ink);border-image:linear-gradient(90deg,var(--blu),var(--ai)) 1;border-bottom-color:var(--line);padding:12px max(3vw,18px) 10px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
h1{font-stretch:118%;font-weight:800;font-size:clamp(20px,2.4vw,28px);line-height:1.05;margin:0}
.goal{font-size:14.5px;color:var(--mut)}
.goal b{color:var(--ink)}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cours{border:2px solid var(--ink);color:var(--ink);text-decoration:none;font-size:16px;padding:7px 12px;min-height:40px;display:inline-flex;align-items:center}
.cours:hover{background:var(--pane)}
.cours:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.scen{font-size:14.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.scen select:disabled{opacity:.6;cursor:not-allowed}
.scen select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:2px solid var(--ink);min-height:40px;padding:4px 8px}
button{font:inherit;font-size:16px;min-height:40px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);padding:4px 12px;border-radius:0;cursor:pointer}
button.main{background:var(--ink);color:var(--bg);font-weight:800;font-size:17px;min-height:48px;width:100%}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.main:disabled{opacity:1;background:var(--line);color:var(--mut);border-color:var(--line)}
main{flex:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:clamp(24px,3vw,40px);padding:16px max(3vw,18px) 14px;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.stage{--ph:var(--ink)}
.clock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--ph);color:var(--bg);padding:10px 14px}
.clock .note{color:inherit;opacity:.85}
.clock .q{font-stretch:125%;font-weight:800;font-size:34px;line-height:1}
.note{font-size:14.5px;color:var(--mut)}
.alert{border-left:6px solid var(--ph);background:var(--pane);padding:10px 14px;font-size:14px;line-height:1.45;min-height:40px}
.alert .ah{display:block;font-size:15.5px;margin-bottom:2px}
.alert p{margin:4px 0 0}
.alert p.poly{font-style:italic}
.cpt{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.01em;padding:0 6px;border:1px solid currentColor;border-radius:9px;opacity:.9;white-space:nowrap}
.reading{margin:8px 0;padding:8px 12px;background:var(--pane);font-size:15px}
.reading ul{margin:4px 0 0;padding-left:18px}
.alert.on{border-left-color:var(--ph);background:var(--red);color:var(--bg);font-weight:500;animation:pop .35s ease-out}
.alert.on b{color:var(--bg);font-weight:800}
.alert.on.calm{background:var(--pane);color:var(--ink);font-weight:400}
.alert.on.calm b{color:var(--ink)}
@keyframes pop{from{opacity:0}to{opacity:1}}
.ends{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-stretch:112%;font-size:16.5px}
.ends span:first-child{color:var(--blu)}
.ends span:last-child{color:var(--ai);text-align:right}
.ends small{display:block;font-weight:400;font-size:13px;color:var(--mut);font-stretch:100%}
button.prim{background:var(--ink);color:var(--bg);font-weight:800}
button.quiet{border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline;min-height:32px;padding:4px 6px}
.invite{font-size:15px;border-left:6px solid var(--grn);background:var(--pane);padding:6px 10px;margin:8px 0}
.card h3{font-size:15px;margin:14px 0 2px}
.slider{position:relative}
.ticks{display:flex;justify-content:space-between;margin-top:-6px}
.ticks button{border:0;background:none;padding:2px;min-height:0;width:32px;display:flex;justify-content:center;color:var(--mut);cursor:pointer}
.ticks button.on{color:var(--ink)}
.ticks svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.tip{position:absolute;top:calc(100% + 6px);transform:translateX(-50%);width:300px;background:var(--ink);color:var(--bg);padding:9px 12px;font-size:14px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s;z-index:4}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:2px}
input[type=range]{width:100%;height:10px;margin:13px 0;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,var(--blu),var(--ai));border-radius:5px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--bg);border:5px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--bg);border:5px solid var(--ink)}
.defsW summary{cursor:pointer;font-size:14.5px;font-weight:700;min-height:28px}
.col.left,.col.right{overflow:auto;padding-bottom:4px;scrollbar-width:none}
.col.left::-webkit-scrollbar,.col.right::-webkit-scrollbar{display:none}
#next{position:sticky;bottom:0;z-index:2;box-shadow:0 -8px 12px var(--bg)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0 14px}
.steps button{border:1px solid var(--line);background:var(--bg);padding:8px 9px;font-size:13.2px;line-height:1.4;color:var(--mut);text-align:left;min-height:0;display:block;width:100%;height:100%}
.steps button:hover{border-color:var(--ink)}
.steps b{display:block;color:var(--ink);font-size:13.8px;margin-bottom:4px}
.steps .on{border:2px solid var(--ink);color:var(--ink);background:var(--pane)}
.defs{display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:14px;color:var(--mut);line-height:1.5}
.defs p{margin:0}
.defs b{color:var(--ink)}
.doing{border:2px solid var(--ink);padding:12px 16px;font-size:15.5px;line-height:1.55}
.doing h3{margin:0 0 8px;font-size:14.5px;color:var(--blu);font-weight:800}
.rev{color:var(--grn)}.cost{color:var(--red)}
.doing p{margin:0}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.nums div{font-size:13.5px;color:var(--mut)}
.nums b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;font-stretch:112%}
.dec{display:none;border:3px solid var(--red);padding:12px 14px;font-size:15.5px;line-height:1.5}
.dec.on{display:block}
.dec p{margin:0 0 12px}
.dec .opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dec button{font-size:14.5px;line-height:1.35;padding:8px 10px;min-height:58px;text-align:left}
.dec button b{display:block;font-size:15.5px;color:var(--c)}
.dec button{border-color:var(--c);border-left-width:6px;background:color-mix(in srgb,var(--c) 7%,var(--bg))}
.fix{display:none;border:2px dashed var(--red);color:var(--red);font-weight:700}
.fix.on{display:block}
.fig{position:relative;flex:1;min-height:150px}
.bnl{font-size:13.5px;color:var(--mut);margin-top:-6px}.bnl span{margin-right:8px;white-space:nowrap}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font-family:Archivo,sans-serif;font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.verdict{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;font-size:15.5px}
.verdict .w{font-stretch:120%;font-weight:800;font-size:24px}
.good{color:var(--grn)}.bad{color:var(--red)}
.score{font-size:14.5px;max-height:none;overflow:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:700;color:var(--mut)}
tr.best td{font-weight:800;background:color-mix(in srgb,var(--grn) 10%,var(--bg))}
th{border-bottom:2px solid var(--ink)}
.ok{color:var(--grn)}.ko{color:var(--red)}
#report{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
#report.on{display:flex}
.card{background:var(--bg);border:3px solid var(--ink);max-width:760px;width:100%;max-height:100%;overflow:auto;padding:16px 18px}
.card h2{font-stretch:115%;font-weight:800;font-size:24px;margin:0 0 6px}
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.checks div{border:2px solid var(--line);padding:6px 8px;font-size:14.5px}
.checks b{display:block;font-size:20px;font-stretch:115%}
.card ol{padding-left:20px;margin:8px 0}
.card li{margin-bottom:8px}
details{margin-top:8px;font-size:14.5px}
summary{cursor:pointer;font-weight:700}
@media(max-width:760px){.dec .opts{grid-template-columns:1fr}body{display:block;height:auto}main{grid-template-columns:minmax(0,1fr)}.fig{min-height:240px}.defs,.steps{grid-template-columns:1fr}.nums{grid-template-columns:repeat(2,minmax(0,1fr))}.checks{grid-template-columns:1fr}#next{position:sticky;bottom:8px}}
@media(prefers-reduced-motion:reduce){.alert.on{animation:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1 data-t="title">La règle face à la complexité</h1>
    <div class="goal" id="goal"></div>
  </div>
  <div class="top">
    <button id="replay" class="prim" type="button" data-t="replay">Rejouer la même partie</button>
    <button id="fresh" class="quiet" type="button" data-t="fresh">Nouvelle partie</button>
    <a class="cours" id="cours" href="https://docs.google.com/document/d/1ay_agWhVPo04YwCAmICAyyNbqJaypyfLS0xQ11O9Esw/edit?usp=sharing" target="_blank" rel="noopener">Révision du cours</a>
    <label class="scen"><span id="scenL">Scénario</span> <select id="scen"></select></label>
    <button id="lang" type="button">IT</button>
  </div>
</header>
<main>
  <div class="col left">
    <div class="dec" id="dec"></div>
    <button class="fix" id="fixBtn" type="button"></button>
    <div class="ends"><span id="attL">Modélisation rigide</span><span id="ampL">Système d'IA</span></div>
    <div class="slider"><input type="range" id="x" min="0" max="100" step="5" aria-label="Modélisation rigide ou système d'IA"><div class="ticks" id="ticks"></div><div class="tip" id="tip" role="status"></div></div>
    <details class="defsW" id="defsW"><summary id="defsS"></summary><div class="defs"><p id="defA"></p><p id="defB"></p></div></details>
    <div class="doing"><h3 id="doingT"></h3><p id="doing"></p><div class="nums" id="nums"></div></div>
    <div class="score"><table id="score"></table></div>
    <button class="main" id="next" type="button"></button>
  </div>
  <div class="col right">
    <div class="stage" id="stage">
      <div class="clock"><span class="q" id="qlabel">T1</span><span><b id="phase"></b> · <span class="note" id="qsub"></span></span></div>
      <div class="alert" id="alert" role="status"></div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="fig" id="box"><svg id="chart" role="img" aria-label="Résultat par trimestre"></svg></div>
    <div class="bnl" id="bnl"></div>
  </div>
</main>
<div id="report"><div class="card" id="card"></div></div>

<script>
{
const P={mh:150,dec:.35,H:400,invK:1600,ef:.3,p0:.5,rev:3,wh:12,errC:25,backC:8,fixA:8000,fixB:35000,team:2200,priceM:2.5,outFail:.9,aiUpd:300,
 actFix:1500,actRev:.2,leakF:.5,cyberE:.08,srvMin:50,srvMig:4000,sovM:1.5,kMin:.3,kRate:.3,kTeam:.3,kErr:.03,nAI:5,nF:3,rareP:.12,inspF:60,inspBad:.02,suitA:4000,suitF:.25,quotaE:.02,autoR:.1,fitR:.06,needsE:.02,hallE:.03,paidM:1.2,GOAL:95000,CONF:.95,BACK:500};
const T={
fr:{title:"La règle face à la complexité",replay:"Rejouer la même partie",fresh:"Nouvelle partie",scenL:"Scénario",coursL:"Révision du cours",scenLock:"Scénario bloqué pendant le cycle de parties : rechargez la page pour en changer.",attL:"Modélisation rigide",attS:"atténuer la variété",ampL:"Système d'IA",ampS:"amplifier la variété",
defsS:"Que fait concrètement chaque pôle ?",
phases:["Phase 1 · croisière","Phase 2 · turbulences","Phase 3 · tempête"],
qsub:(q,v)=>`trimestre ${q}/12 · ${v} {U} à traiter`,

doing:(h,c,f,a,m,k)=>`Vous consacrez <b>${h} h</b> au formulaire fermé (il couvre <b>${c}</b> du flux standard). Ce trimestre, <b>${f}</b> {U} passent par le formulaire, l'assistant IA en lit <b>${a}</b>, l'équipe en vérifie <b>${m}</b> à la main. Compétences de l'équipe : <b>${k}</b>.`,
doingAI:(a,m,k)=>`Le formulaire fermé est abandonné : l'assistant IA lit <b>${a}</b> {U} ce trimestre, l'équipe en vérifie <b>${m}</b> à la main. Un changement de règle ne demandera qu'une mise à jour de l'assistant. Compétences de l'équipe : <b>${k}</b>.`,

alertT:"Imprévu !",alertN:"imprévu sans effet pour vous.",calm:"Rien d'imprévu au dernier trimestre.",target:"objectif",
score:["Essai","Partie","Résultat","Sans erreur","Retard","Objectif"],
rep:"Bilan après trois ans",checks:["Résultat cumulé","Traités sans erreur","En retard à la fin"],
win:"Objectif atteint.",lose:"Objectif manqué.",

qsT:"Pour le bilan en classe",

copy:"Copier le bilan",copied:"Copié.",nocopy:"Copie refusée.",close:"Fermer",howS:"Comment fonctionne le modèle",
how:"Le curseur reprend la loi de la variété requise d'Ashby, appliquée au management par Stafford Beer : face à un environnement varié, on peut atténuer la variété (modélisation rigide : catégories, formulaires) ou amplifier sa capacité de réponse (système d'IA : un modèle qui traite chaque cas tel qu'il est). Les cinq scénarios ont les mêmes chiffres ; seuls le métier et le récit des imprévus changent. Le formulaire couvre au plus 85 % du flux standard ; sans entretien (jusqu'à environ 150 h par trimestre), il s'use. Un changement de règle bloque une partie de ce que traite le formulaire : on choisit entre le refaire (8 000 € plus jusqu'à 30 000 € selon la couverture), passer à l'IA (le formulaire est abandonné) ou attendre (ce qui est bloqué s'accumule en retard). L'assistant coûte 0,50 € par {u} (moins chaque trimestre) et se trompe davantage sur les cas inédits. Il peut voir ses prix multipliés par 2,5 ; être suspendu deux trimestres (on choisit : fournisseur européen, 4 000 € puis 50 % plus cher ; retour au formulaire ; attente) ; être piégé par une cyberattaque ; faire fuir des données (amende de 0,50 € pour chaque dossier envoyé dans l'année) ; tomber sous une loi sur l'IA (contrôle humain de 20 % de ce qu'il lit, 1 500 € par trimestre). D'autres imprévus frappent surtout le formulaire, qui ne voit que ce qui est déclaré : {legal} ; et les refus décidés par l'IA peuvent être contestés (RGPD), il faut alors les réexaminer à la main. Dès les premiers trimestres arrivent de petits imprévus : {early}, un assistant qui « hallucine », une offre d'essai qui se termine. Chaque partie tire ses imprévus au hasard, à des trimestres différents ; parfois s'ajoute un événement rare : {rare}. Plus l'IA fait le travail, plus l'équipe perd la main : ses compétences descendent jusqu'à 30 %, et alors elle traite moins de dossiers et se trompe davantage ; elles remontent lentement. L'équipe a 2 200 heures, 0,6 h par {u} ; le reste passe en retard (8 € par trimestre). Une erreur coûte 25 €. Chiffres fictifs, pour comparer des stratégies.",

how:"Il cursore riprende la legge della varietà necessaria di Ashby, applicata al management da Stafford Beer: davanti a un ambiente vario si può attenuare la varietà (modellizzazione rigida: categorie, moduli) o amplificare la propria capacità di risposta (sistema di IA: un modello che tratta ogni caso così com'è). I cinque scenari hanno gli stessi numeri; cambiano solo il mestiere e il racconto degli imprevisti. Il modulo copre al massimo l'85% del flusso standard; senza manutenzione (fino a circa 150 h a trimestre) si consuma. Un cambio di regola blocca una parte di ciò che tratta il modulo: si sceglie fra rifarlo (8.000 € più fino a 30.000 € secondo la copertura), passare all'IA (il modulo si abbandona) o aspettare (ciò che è bloccato si accumula in arretrato). L'assistente costa 0,50 € a unità (meno ogni trimestre) e sbaglia di più sui casi inediti. Può moltiplicare i prezzi per 2,5; essere sospeso per due trimestri (si sceglie: fornitore europeo, 4.000 € e poi il 50% più caro; ritorno al modulo; attesa); cadere in un attacco informatico; far trapelare dati (multa di 0,50 € per ogni pratica inviata nell'ultimo anno); ricadere sotto una legge sull'IA (controllo umano del 20% di ciò che legge, 1.500 € a trimestre). Altri imprevisti colpiscono soprattutto il modulo, che vede solo ciò che è dichiarato: {legal}; e i rifiuti decisi dall'IA possono essere contestati (RGPD), e allora vanno riesaminati a mano. Fin dai primi trimestri arrivano piccoli imprevisti: {early}, un assistente che «allucina», un'offerta di prova che finisce. Ogni partita estrae i suoi imprevisti a caso, in trimestri diversi; a volte si aggiunge un evento raro: {rare}. Più l'IA fa il lavoro, più la squadra perde la mano: le competenze scendono fino al 30%, e allora tratta meno pratiche e sbaglia di più; risalgono lentamente. La squadra ha 2.200 ore, 0,6 h a unità; il resto passa in arretrato (8 € a trimestre). Un errore costa 25 €. Numeri fittizi, per confrontare strategie.",

 goal:`Service clients d'un grand logisticien · chaque commande bien traitée rapporte <b>3 €</b> · objectif sur 3 ans : <b>résultat ≥ 95 k€</b>, <b>≥ 95 % de commandes sans erreur</b>, <b>≤ 500 en retard</b> à la fin · <b>notez sur une feuille, à chaque trimestre, votre réglage et le résultat</b>`,
 defA:"<b>Modélisation rigide : un portail de commande fermé.</b> Les clients saisissent leurs commandes dans un portail à listes (code produit, Incoterm, code douanier, créneau) ; un script vérifie et prépare les documents. Ce qui n'entre pas est refusé : on simplifie le réel pour le rendre calculable. Coûte des heures à construire et à entretenir ; ensuite presque gratuit. À chaque changement des règles douanières, il faut refaire portail et script.",
 defB:"<b>Système d'IA : un agent d'IA générative.</b> Les commandes arrivent telles qu'elles sont (courriels, PDF, factures en plusieurs langues) ; l'agent les lit, vérifie les codes et rédige les documents de douane. Le réel reste complexe, le modèle l'absorbe. Rien à construire ; chaque commande est payée au fournisseur, qui fixe ses prix, dépend de ses serveurs et des lois qui s'appliquent à eux. Plus l'agent travaille, moins l'équipe sait faire le travail elle-même.",
 steps:[["0 · Tout en règles","Portail à listes déroulantes, codes produit et douaniers imposés, script qui prépare les documents. Ce qui n'entre pas est refusé ou traité à la main."],["25 · Règles et tableur","Portail pour les clients réguliers ; pour le reste, un fichier Excel partagé avec les tarifs douaniers et des macros. L'IA lit seulement quelques factures étrangères."],["50 · Mixte","Portail pour les commandes standard ; l'IA lit les courriels et les factures, l'équipe relit les documents de douane."],["75 · IA d'abord","Les commandes arrivent par courriel ; l'agent les lit et prépare documents et réservations, l'équipe valide. Le portail n'est presque plus entretenu."],["100 · Tout IA","Un agent IA branché sur la messagerie, l'entrepôt et le portail des douanes traite tout ; l'équipe ne voit que les alertes. Le portail s'use et disparaît."]],
 decH:{std:"Le code des douanes change.",pol:"Une guerre commerciale impose de nouveaux droits de douane."},
 ev:{law:"Le code des douanes change (nouvelle nomenclature, taxe carbone aux frontières).",surge:"Black Friday : +25 % de commandes d'un coup.",kpi:"Un gros client exige une confirmation en deux heures : plus d'erreurs ce trimestre.",novel:"Le commerce en ligne transfrontalier explose (petits colis, retours, places de marché) : 20 % de commandes en plus ne rentrent dans aucun portail.",
  insp:k=>`Contrôle des douanes : des marchandises déclarées « pièces détachées » étaient soumises à licence. Les expéditeurs paient l'amende ; vous reprenez les commandes validées sans vraiment les lire : ${k}.`,
  suit:k=>`Un client attaque : sa marchandise périssable est restée bloquée à la frontière, le contrat avait été mal lu. L'affaire fait la une de la presse spécialisée ; avocat et révision à la main de ses commandes : ${k}, d'autant plus que vous les avez laissées passer par le portail.`,
  quota:"Un expéditeur fractionne ses envois pour rester sous les seuils de déclaration : chaque commande, prise seule, est en règle. Le portail et l'agent regardent une commande à la fois et laissent passer ; une équipe expérimentée s'en aperçoit. Plus d'erreurs ce trimestre.",
  pand:"Pandémie : usines à l'arrêt, −20 % de commandes, et l'équipe, malade ou confinée, travaille à 75 %, pendant deux trimestres.",
  clos:"Inondation : l'entrepôt et les bureaux sont fermés, l'équipe travaille à distance, à 70 %, pendant deux trimestres. Le portail en ligne continue à tourner.",
  fit:"Des commandes hors normes (convoi exceptionnel, œuvres d'art, animaux vivants) ne rentrent dans aucune case du portail : 6 % des commandes du portail reviennent à la main ce trimestre.",
  needs:"Des clients aux exigences particulières (température dirigée, créneaux de nuit, matières dangereuses) : le portail n'a pas de case, et le script valide des commandes incomplètes. Un peu plus d'erreurs ce trimestre.",
  pol:"Guerre commerciale : un pays impose de nouveaux droits de douane ; ses commandes demandent de nouvelles pièces, et 10 % de commandes en plus ne rentrent plus dans aucun portail."},
 tag:{law:"douane",surge:"Black Friday",kpi:"2 h",insp:"douanes",quota:"fractionnement",fit:"hors normes",clos:"inondation",pol:"droits de douane"}},
it_:{name:"Informatique",u:"ticket",U:"tickets",Who:"Des employés",who:"des employés",data:"les données des employés",
 legal:"audit de licences d'un éditeur, procès d'un client après une panne, utilisateur qui obtient des droits par petites demandes successives",early:"des postes atypiques",rare:"pandémie, grève générale, fermeture du siège, canicule, directive européenne sur la cybersécurité",
 goal:`Support informatique d'un grand groupe · chaque ticket bien résolu rapporte <b>3 €</b> · objectif sur 3 ans : <b>résultat ≥ 95 k€</b>, <b>≥ 95 % de tickets sans erreur</b>, <b>≤ 500 en retard</b> à la fin · <b>notez sur une feuille, à chaque trimestre, votre réglage et le résultat</b>`,
 defA:"<b>Modélisation rigide : un catalogue de services fermé.</b> Les employés choisissent leur demande dans un catalogue à listes (type de panne, logiciel, priorité) ; des scripts appliquent la solution prévue. Ce qui n'entre pas est renvoyé : on simplifie le réel pour le rendre calculable. Coûte des heures à construire et à entretenir ; ensuite presque gratuit. À chaque changement de système, il faut refaire catalogue et scripts.",
 defB:"<b>Système d'IA : un assistant d'IA générative.</b> Les tickets arrivent tels qu'ils sont (courriels, captures d'écran, journaux d'erreur) ; l'assistant les lit, diagnostique et propose la correction. Le réel reste complexe, le modèle l'absorbe. Rien à construire ; chaque ticket est payé au fournisseur, qui fixe ses prix, dépend de ses serveurs et des lois qui s'appliquent à eux. Plus l'assistant travaille, moins l'équipe sait faire le travail elle-même.",
 steps:[["0 · Tout en règles","Catalogue à listes déroulantes, scripts de résolution automatiques, une procédure par panne. Ce qui n'entre pas est renvoyé ou traité par un technicien."],["25 · Règles et tableur","Catalogue pour les demandes courantes ; pour le reste, un fichier Excel partagé de pannes connues et de macros. L'IA lit seulement quelques journaux d'erreur."],["50 · Mixte","Catalogue pour les demandes standard ; l'IA lit les courriels et les captures d'écran, l'équipe relit ses diagnostics."],["75 · IA d'abord","Les tickets arrivent par courriel et messagerie ; l'assistant diagnostique et prépare la correction, l'équipe valide. Le catalogue n'est presque plus entretenu."],["100 · Tout IA","Un agent IA branché sur la messagerie et les serveurs corrige tout seul ; l'équipe ne voit que les alertes. Le catalogue s'use et disparaît."]],
 decH:{std:"Le groupe change de système d'information.",pol:"Une directive européenne sur la cybersécurité entre en vigueur."},
 ev:{law:"Le groupe change de système d'information (nouveau logiciel de gestion, nouvelle messagerie).",surge:"Faille « zero-day » dans un logiciel courant : +25 % de tickets d'un coup.",kpi:"La direction impose une résolution en quatre heures : plus d'erreurs ce trimestre.",novel:"Télétravail massif et appareils personnels : 20 % de tickets en plus ne rentrent dans aucune catégorie du catalogue.",
  insp:k=>`Audit de licences d'un éditeur : des postes déclarés conformes utilisaient des logiciels sans licence. Le groupe paie ; vous reprenez les tickets validés sans vraiment les lire : ${k}.`,
  suit:k=>`Un client attaque après une panne de deux jours : le contrat de service promettait quatre heures. L'affaire fait la une ; avocat et révision à la main de ses tickets : ${k}, d'autant plus que vous les avez laissés passer par le catalogue.`,
  quota:"Un utilisateur ouvre des dizaines de petites demandes d'accès, chacune légitime, et finit administrateur : chaque ticket, pris seul, est en règle. Le catalogue et l'assistant regardent un ticket à la fois et laissent passer ; une équipe expérimentée s'en aperçoit. Plus d'erreurs ce trimestre.",
  pand:"Pandémie : projets gelés (−20 % de tickets) et l'équipe, malade ou confinée, travaille à 75 %, pendant deux trimestres.",
  clos:"Le siège est fermé après un incendie : l'équipe travaille à distance, à 70 %, pendant deux trimestres. Le catalogue en ligne continue à tourner.",
  fit:"Des postes atypiques (laboratoires, machines industrielles, vieux logiciels) ne rentrent dans aucune catégorie : 6 % des tickets du catalogue reviennent à la main ce trimestre.",
  needs:"Des utilisateurs aux besoins particuliers (lecteurs d'écran, accessibilité) : le catalogue n'a pas de case, et les scripts ferment des tickets non résolus. Un peu plus d'erreurs ce trimestre.",
  pol:"Une directive européenne sur la cybersécurité (NIS 2) impose de nouvelles étapes aux tickets de sécurité ; 10 % de tickets en plus ne rentrent plus dans aucune catégorie."},
 tag:{law:"migration",surge:"zero-day",kpi:"4 h",insp:"licences",quota:"droits",fit:"postes",clos:"incendie",pol:"NIS 2"}},
assur:{name:"Assurance",u:"sinistre",U:"sinistres",Who:"Des assurés",who:"des assurés",data:"les données des assurés",
 legal:"contrôle du régulateur sur des indemnités mal calculées, procès d'un assuré sous-indemnisé, réseau qui déclare de petits sinistres sous le seuil de contrôle",early:"des biens atypiques",rare:"pandémie, grève générale, fermeture du siège, canicule, nouvelle obligation de couverture",
 goal:`Service sinistres d'un assureur · chaque sinistre bien traité rapporte <b>3 €</b> · objectif sur 3 ans : <b>résultat ≥ 95 k€</b>, <b>≥ 95 % de sinistres sans erreur</b>, <b>≤ 500 en retard</b> à la fin · <b>notez sur une feuille, à chaque trimestre, votre réglage et le résultat</b>`,
 defA:"<b>Modélisation rigide : un barème fermé.</b> Les assurés déclarent leur sinistre dans un formulaire à listes (type de dommage, montant, franchise) ; un script calcule l'indemnité au barème. Ce qui n'entre pas est renvoyé : on simplifie le réel pour le rendre calculable. Coûte des heures à construire et à entretenir ; ensuite presque gratuit. À chaque changement des règles d'indemnisation, il faut refaire formulaire et barème.",
 defB:"<b>Système d'IA : un assistant d'IA générative.</b> Les déclarations arrivent telles qu'elles sont (photos, devis, lettres) ; l'assistant les lit, estime le dommage et rédige la réponse. Le réel reste complexe, le modèle l'absorbe. Rien à construire ; chaque sinistre est payé au fournisseur, qui fixe ses prix, dépend de ses serveurs et des lois qui s'appliquent à eux. Plus l'assistant travaille, moins l'équipe sait faire le travail elle-même.",
 steps:[["0 · Tout en règles","Formulaire de déclaration à listes, barème fixe, script qui calcule l'indemnité. Ce qui n'entre pas est renvoyé ou expertisé à la main."],["25 · Règles et tableur","Barème pour les sinistres courants ; pour le reste, un fichier Excel partagé de cas et de macros. L'IA lit seulement quelques devis."],["50 · Mixte","Barème pour les sinistres standard ; l'IA lit photos, devis et lettres, l'équipe relit ses estimations."],["75 · IA d'abord","Les déclarations arrivent par courriel et application ; l'assistant estime et prépare l'offre, l'équipe valide. Le barème n'est presque plus entretenu."],["100 · Tout IA","Un agent IA branché sur l'application et les virements indemnise tout seul ; l'équipe ne voit que les cas signalés. Le barème s'use et disparaît."]],
 decH:{std:"Les règles d'indemnisation changent.",pol:"Une nouvelle obligation de couverture entre en vigueur."},
 ev:{law:"Une loi change les règles d'indemnisation (catastrophes naturelles, franchises).",surge:"Grêle géante sur la région : +25 % de sinistres d'un coup.",kpi:"Le régulateur exige une indemnisation sous dix jours : plus d'erreurs ce trimestre.",novel:"Les sinistres climatiques se multiplient (fissures dues à la sécheresse, inondations) : 20 % de sinistres en plus ne rentrent dans aucun barème.",
  insp:k=>`Contrôle du régulateur des assurances : des sinistres indemnisés au barème étaient sous-évalués ou frauduleux. L'assureur doit corriger ; vous reprenez les dossiers validés sans vraiment les lire : ${k}.`,
  suit:k=>`Un assuré attaque : son indemnité, calculée au barème, couvre un tiers du dommage réel. L'affaire fait la une ; avocat et révision à la main des dossiers semblables : ${k}, d'autant plus que vous les avez laissés passer par le barème.`,
  quota:"Fraude organisée : un réseau déclare de nombreux petits sinistres sous le seuil de contrôle : chaque dossier, pris seul, est en règle. Le barème et l'assistant regardent un dossier à la fois et laissent passer ; une équipe expérimentée s'en aperçoit. Plus d'erreurs ce trimestre.",
  pand:"Pandémie : moins de déplacements, −20 % de sinistres, et l'équipe, malade ou confinée, travaille à 75 %, pendant deux trimestres.",
  clos:"Le siège est fermé après une alerte à la bombe puis des travaux : l'équipe travaille à distance, à 70 %, pendant deux trimestres. Le formulaire en ligne continue à tourner.",
  fit:"Des biens atypiques (œuvres d'art, panneaux solaires, vélos cargo) ne rentrent dans aucune case du barème : 6 % des sinistres du formulaire reviennent à la main ce trimestre.",
  needs:"Des assurés vulnérables (personnes âgées, handicap) qui ont besoin d'être accompagnés : le formulaire n'a pas de case, et le script clôt des dossiers incomplets. Un peu plus d'erreurs ce trimestre.",
  pol:"Changement de gouvernement : une loi impose de couvrir les émeutes et les catastrophes climatiques ; ces dossiers demandent de nouvelles pièces, et 10 % de sinistres en plus ne rentrent plus dans aucun barème."},
 tag:{law:"indemnisation",surge:"grêle",kpi:"10 jours",insp:"régulateur",quota:"fraude",fit:"biens atypiques",pol:"couverture"}},
hosp:{name:"Hôpital",u:"séjour",U:"séjours",Who:"Des patients",who:"des patients",data:"les données de santé des patients",
 legal:"contrôle de l'Assurance maladie sur le codage, procès d'un patient pour une facture erronée, service qui fractionne les séjours",early:"des patients aux parcours atypiques",rare:"pandémie, grève générale, fermeture d'un bâtiment, canicule, restriction de l'aide médicale aux étrangers",
 goal:`Service de codage d'un grand hôpital · chaque séjour bien codé rapporte <b>3 €</b> · objectif sur 3 ans : <b>résultat ≥ 95 k€</b>, <b>≥ 95 % de séjours sans erreur</b>, <b>≤ 500 en retard</b> à la fin · <b>notez sur une feuille, à chaque trimestre, votre réglage et le résultat</b>`,
 defA:"<b>Modélisation rigide : une nomenclature fermée.</b> Les médecins remplissent une fiche à listes de codes (diagnostics, actes) ; un script groupe le séjour et prépare la facture. Ce qui n'entre pas est renvoyé : on simplifie le réel pour le rendre calculable. Coûte des heures à construire et à entretenir ; ensuite presque gratuit. À chaque nouvelle version de la nomenclature, il faut refaire fiche et script.",
 defB:"<b>Système d'IA : un assistant d'IA générative.</b> Les dossiers arrivent tels qu'ils sont (comptes rendus, ordonnances, lettres) ; l'assistant les lit et propose les codes. Le réel reste complexe, le modèle l'absorbe. Rien à construire ; chaque séjour est payé au fournisseur, qui fixe ses prix, dépend de ses serveurs et des lois qui s'appliquent à eux. Plus l'assistant travaille, moins l'équipe sait faire le travail elle-même.",
 steps:[["0 · Tout en règles","Fiche de codage à listes, script qui groupe et facture, une règle par acte. Ce qui n'entre pas est renvoyé au médecin ou codé à la main."],["25 · Règles et tableur","Fiche pour les séjours courants ; pour le reste, un fichier Excel partagé de codes et de macros. L'IA lit seulement quelques comptes rendus."],["50 · Mixte","Fiche pour les séjours standard ; l'IA lit les comptes rendus, l'équipe relit les codes proposés."],["75 · IA d'abord","Les dossiers arrivent du logiciel de soins ; l'assistant propose tous les codes, l'équipe valide. La fiche n'est presque plus entretenue."],["100 · Tout IA","Un agent IA branché sur le dossier patient code et facture tout seul ; l'équipe ne voit que les alertes. La fiche s'use et disparaît."]],
 decH:{std:"La nomenclature change.",pol:"L'aide médicale aux étrangers est restreinte."},
 ev:{law:"La nomenclature change (nouvelle version de la classification des maladies).",surge:"Épidémie de grippe : +25 % de séjours d'un coup.",kpi:"La direction exige un codage sous 48 heures pour la trésorerie : plus d'erreurs ce trimestre.",novel:"Nouvelles prises en charge (chirurgie ambulatoire, télésurveillance) : 20 % de séjours en plus ne rentrent dans aucun code.",
  insp:k=>`Contrôle de l'Assurance maladie : des séjours codés « complexes » ne l'étaient pas. L'hôpital rembourse ; vous reprenez les dossiers validés sans vraiment les lire : ${k}.`,
  suit:k=>`Un patient attaque : facture erronée, séjour mal codé. L'affaire fait la une ; avocat et révision à la main des séjours du même service : ${k}, d'autant plus que vous les avez laissés passer par la fiche.`,
  quota:"Un service multiplie les courts séjours pour un même patient : chaque séjour, pris seul, est en règle. La fiche et l'assistant regardent un séjour à la fois et laissent passer ; une équipe expérimentée s'en aperçoit. Plus d'erreurs ce trimestre.",
  pand:"Pandémie : les opérations programmées sont reportées (−20 % de séjours à coder) et l'équipe, malade ou réquisitionnée, travaille à 75 %, pendant deux trimestres.",
  clos:"Un bâtiment de l'hôpital est fermé après une inondation : l'équipe travaille à distance, à 70 %, pendant deux trimestres. La fiche en ligne continue à tourner.",
  fit:"Des patients aux parcours atypiques (maladies rares, polyhandicap, séjours multiples) ne rentrent dans aucune case : 6 % des séjours de la fiche reviennent à la main ce trimestre.",
  needs:"Des patients aux besoins particuliers (interprète, accompagnement) : la fiche n'a pas de case, et le script facture des séjours incomplets. Un peu plus d'erreurs ce trimestre.",
  pol:"Changement de gouvernement : l'aide médicale aux étrangers est restreinte ; leurs séjours demandent de nouvelles pièces, et 10 % de séjours en plus ne rentrent plus dans aucun code."},
 tag:{law:"nomenclature",surge:"grippe",kpi:"48 h",insp:"contrôle",quota:"fractionnement",fit:"parcours",clos:"inondation",pol:"aide médicale"}}},
it:{
stages:{name:"Ufficio stage",u:"convenzione",U:"convenzioni",Who:"Degli studenti",who:"degli studenti",data:"i dati degli studenti",
 legal:"controllo dell'ispettorato del lavoro su stage che nascondono ore in più, causa di una stagista, azienda che supera la quota di stagisti",early:"studenti che il modulo non sa classificare",rare:"pandemia, sciopero generale, chiusura dell'università, canicola, legge sugli studenti stranieri",
 goal:`Ufficio stage di una grande università · ogni convenzione trattata bene rende <b>3 €</b> · obiettivo in 3 anni: <b>risultato ≥ 95 k€</b>, <b>≥ 95% di convenzioni senza errori</b>, <b>≤ 500 in arretrato</b> alla fine · <b>annotate su un foglio, a ogni trimestre, la vostra scelta e il risultato</b>`,
 defA:"<b>Modellizzazione rigida: un modulo chiuso.</b> Gli studenti compilano un modulo online a liste (paese, durata in settimane, compenso calcolato); uno script verifica. Ciò che non entra viene rimandato: si semplifica il reale per renderlo calcolabile. Costa ore per costruirlo e mantenerlo; poi quasi gratis. A ogni cambio di legge bisogna rifare modulo e script.",
 defB:"<b>Sistema di IA: un assistente di IA generativa.</b> Le convenzioni arrivano così come sono (PDF delle aziende, lingue, allegati); l'assistente le legge, estrae, verifica e scrive la risposta. Il reale resta complesso, lo assorbe il modello. Niente da costruire; ogni convenzione si paga al fornitore, che fissa i prezzi, dipende dai suoi server e dalle leggi che li regolano. Più l'assistente lavora, meno la squadra sa fare il lavoro da sé.",
 steps:[["0 · Tutto in regole","Modulo online a menu a tendina, script che calcola compenso e durata, un solo modello di convenzione. Ciò che non entra viene rimandato o verificato a mano."],["25 · Regole e foglio di calcolo","Modulo per i casi correnti; per il resto, un file Excel condiviso con formule e macro. L'assistente IA legge solo qualche PDF straniero."],["50 · Misto","Modulo per i casi standard; l'assistente IA legge i PDF delle aziende e gli allegati, la squadra rilegge ciò che produce."],["75 · Prima l'IA","Le convenzioni arrivano per posta elettronica; l'assistente le legge e prepara la risposta, la squadra convalida. Il modulo non si mantiene quasi più."],["100 · Tutto IA","Un agente IA collegato alla casella di posta e al gestionale della didattica tratta tutto; la squadra vede solo i casi segnalati. Il modulo si consuma e scompare."]],
 decH:{std:"La legge sugli stage cambia.",pol:"Entra in vigore una nuova legge sugli studenti stranieri."},
 ev:{law:"La legge sugli stage cambia (compenso, durata massima).",surge:"Rientro sfasato: +25% di convenzioni tutte insieme.",kpi:"Il rettorato esige una risposta in 48 ore: più errori in questo trimestre.",novel:"Arrivano stage fuori Europa e apprendistati: un 20% in più di convenzioni non entra in nessun modulo.",
  insp:k=>`Controllo dell'ispettorato del lavoro: stagisti fanno ore in più, la sera e nel fine settimana, mentre la convenzione dice 35 ore. Le aziende pagano la multa (fino a 2.000 € per stagista); l'università riprende le convenzioni convalidate senza leggerle davvero: ${k}.`,
  suit:k=>`Una stagista fa causa alla sua azienda e all'università: sere non pagate, mansioni da dipendente. Il caso finisce sui giornali; avvocato e revisione a mano delle convenzioni di quell'azienda: ${k}, tanto più che le avete fatte passare dal modulo.`,
  quota:"Un'azienda ospita molti più stagisti di quanti la legge consenta (al massimo il 15% dell'organico): ogni convenzione, presa da sola, è in regola. Il modulo e l'assistente guardano una convenzione alla volta e lasciano passare; una squadra esperta se ne accorge. Più errori in questo trimestre.",
  pand:"Pandemia: le aziende annullano stage (−20% di convenzioni) e la squadra, malata o in confinamento, lavora al 75%, per due trimestri. Nel 2020 gli stage in azienda sono calati del 22% in Francia.",
  clos:"L'università è occupata e poi chiusa dopo delle manifestazioni: la squadra lavora a distanza, al 70%, per due trimestri. Il modulo online continua a funzionare.",
  fit:"Studenti con profili particolari (doppio titolo, tempo parziale, stage frazionato) non entrano in nessuna casella del modulo: il 6% delle convenzioni del modulo torna a mano in questo trimestre.",
  needs:"Studenti con bisogni particolari (disabilità, orari adattati): il modulo non ha una casella per loro, e lo script convalida convenzioni incomplete. Qualche errore in più in questo trimestre.",
  pol:"Cambio di governo: una legge stringe i permessi di soggiorno degli studenti stranieri; le loro convenzioni richiedono nuovi documenti, e un 10% in più di convenzioni non entra in nessun modulo."},
 tag:{surge:"rientro",kpi:"48 h",insp:"ispettorato",quota:"quote",fit:"profili",pol:"stranieri"}},
logi:{name:"Logistica",u:"ordine",U:"ordini",Who:"Dei clienti",who:"dei clienti",data:"i dati dei vostri clienti",
 legal:"controllo doganale su merci dichiarate male, causa di un cliente la cui merce è rimasta bloccata, spedizioniere che frammenta gli invii per restare sotto le soglie",early:"ordini fuori standard",rare:"pandemia, sciopero generale, alluvione del magazzino, canicola, guerra commerciale",
 goal:`Servizio clienti di un grande operatore logistico · ogni ordine trattato bene rende <b>3 €</b> · obiettivo in 3 anni: <b>risultato ≥ 95 k€</b>, <b>≥ 95% di ordini senza errori</b>, <b>≤ 500 in arretrato</b> alla fine · <b>annotate su un foglio, a ogni trimestre, la vostra scelta e il risultato</b>`,
 defA:"<b>Modellizzazione rigida: un portale d'ordine chiuso.</b> I clienti inseriscono gli ordini in un portale a liste (codice prodotto, Incoterm, codice doganale, fascia oraria); uno script verifica e prepara i documenti. Ciò che non entra viene rifiutato: si semplifica il reale per renderlo calcolabile. Costa ore per costruirlo e mantenerlo; poi quasi gratis. A ogni cambio delle regole doganali bisogna rifare portale e script.",
